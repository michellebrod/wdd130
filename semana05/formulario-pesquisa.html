<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pesquisa</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>

    <form>
        <div class="item-formulario coluna2">
                    <label for="nome-completo">Nome Completo:</label>
        <input
            type="text"
            id="nome-completo"
            name="nome-completo">
        </div>
        <div class="item-formulario coluna2"
        <label for="emaildousuario">E-mail:</label>
        <input
            type="email"
            id="emaildousuario"
            name="emaildousuario"
        </div>

        <label for="navegador">
            Qual é o seu navegador de internet favorito?
        </label>

        <select id="navegador" name="navegador">
            <option value="" selected disabled>Escolha uma opção...</option>
            <option value="chrome">Chrome</option>
            <option value="firefox">Firefox</option>
            <option value="edge">Edge</option>
            <option value="brave">Brave</option>
            <option value="other">Outro</option>
        </select>

        <label for="pet">
            Você tem um bichinho de estimação?
        </label>

        <input
            type="checkbox"
            id="pet"
            name="pet"
        >

        <label for="feedback">
            Liste lugares onde você morou:
        </label>

        <textarea
            id="feedback"
            name="feedback"
            rows="4"
            placeholder="Stillwater Florida, Amsterdã Holanda, Timbuktu Mali"
        ></textarea>

        <button type="submit">
            Enviar
        </button>

    </form>

</body>
</html>
